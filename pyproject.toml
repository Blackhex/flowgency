[project]
name = "flowgency"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116",
    "starlette<1.0",
    "portalocker>=3,<4",
    "pydantic>=2.8,<3",
    "uvicorn; sys_platform == 'win32'",
    "uvicorn[standard]; sys_platform != 'win32'",
    "watchfiles>=0.20; sys_platform == 'win32'",
    "jinja2",
    "markdown",
    "nh3>=0.2.18,<0.4",
    "pyyaml",
    "markupsafe",
    "python-multipart",
    "pywin32; sys_platform == 'win32'",
    "tomli-w>=1,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=7",
    "httpx>=0.24",
    "Pillow>=10",
]

[project.scripts]
flowgency = "flowgency.cli:main"

[tool.setuptools.packages.find]
include = ["flowgency*"]

[tool.setuptools.package-data]
flowgency = ["templates/*.html", "static/*", "themes/*.yaml"]
"flowgency.setup_assets" = [
    "copilot/.github/skills/flowgency-setup/*.md",
    "copilot/.github/skills/flowgency-setup/references/*.md",
]

[tool.pytest.ini_options]
markers = [
    "real_runtime: automatic probes against installed external AI runtimes",
]
