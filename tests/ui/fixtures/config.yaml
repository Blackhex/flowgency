schema_version: 6
agency:
  title: Agency UI Gate
  default_team: newsletter
  ai_backend: copilot
  agent_library: __RUNTIME__/agent-library
  compilation_cache: __RUNTIME__/compiled-agents
  memory_store: __RUNTIME__/memory-store
  prompt_store: __RUNTIME__/prompts
memory:
  channels:
    brand-strategy:
      display_name: Brand Strategy
teams:
  newsletter:
    name: Newsletter
    workspace_path: __RUNTIME__/workspaces/newsletter
    path: __RUNTIME__/teams/newsletter
    default_integration: copilot
    runtime:
      timeout: 2400
      permissions:
        mode: restricted
        rules:
          - path: __RUNTIME__/workspaces/newsletter
    agents:
      - name: advisor
        blueprint: advisor
        integration: copilot
        identity:
          display_name: Advisor
          title: Strategy Lead
          emoji: A
        prompts:
          - local-triage
        runtime:
          timeout: 1200
          permissions:
            rules:
              - path: __RUNTIME__/teams/newsletter/editorial
        default_memory:
          scope: channel
          channel: brand-strategy
        routines:
          - id: daily-review
            prompt:
              scope: blueprint
              name: daily-review
            arguments: [--brief]
            schedule:
              at: "09:00"
            memory:
              scope: channel
              channel: brand-strategy
          - id: local-triage
            prompt:
              scope: instance
              name: local-triage
            arguments: [--follow-up]
            schedule:
              every: "1h"
            memory:
              scope: agent
      - name: builder
        blueprint: builder
        integration: script
        identity:
          display_name: Builder
          title: Production Editor
          emoji: B
        default_memory:
          scope: agent
        routines:
          - id: publish-draft
            prompt:
              scope: blueprint
              name: publish-draft
            schedule:
              every: "3600"
            memory:
              scope: routine
    workspaces: []
  research:
    name: Research
    workspace_path: __RUNTIME__/workspaces/research
    path: __RUNTIME__/groups/research
    default_integration: copilot
    agents: []
    workspaces: []