schema_version: 1
flowgency:
  title: Flowgency UI Gate
  default_team: newsletter
  ai_backend: copilot
  agent_library: __RUNTIME__/agent-library
  compilation_cache: __RUNTIME__/compiled-agents
  memory_store: __RUNTIME__/memory-store
  prompt_store: __RUNTIME__/prompts
memory:
  channels:
    brand-strategy:
      display_name: Brand Strategy
teams:
  newsletter:
    name: Newsletter
    workspace_path: __RUNTIME__/workspaces/newsletter
    path: __RUNTIME__/teams/newsletter
    default_integration: copilot
    permissions:
      mode: restricted
      rules:
        - path: __RUNTIME__/workspaces/newsletter
    runtime:
      timeout: 2400
    agents:
      - name: advisor
        blueprint: advisor
        integration: copilot
        identity:
          display_name: Advisor
          title: Strategy Lead
          emoji: A
        prompts:
          - local-triage
        permissions:
          rules:
            - path: __RUNTIME__/teams/newsletter/editorial
        runtime:
          timeout: 1200
        default_memory:
          scope: channel
          channel: brand-strategy
        routines:
          - id: daily-review
            prompt:
              scope: blueprint
              name: daily-review
            arguments: [--brief]
            schedule:
              at: "09:00"
            memory:
              scope: channel
              channel: brand-strategy
          - id: local-triage
            prompt:
              scope: instance
              name: local-triage
            arguments: [--follow-up]
            schedule:
              every: "1h"
            memory:
              scope: agent
      - name: builder
        blueprint: builder
        integration: script
        identity:
          display_name: Builder
          title: Production Editor
          emoji: B
        default_memory:
          scope: agent
        routines:
          - id: publish-draft
            prompt:
              scope: blueprint
              name: publish-draft
            schedule:
              every: "3600"
            memory:
              scope: routine
    workspaces: []
  research:
    name: Research
    workspace_path: __RUNTIME__/workspaces/research
    path: __RUNTIME__/groups/research
    default_integration: copilot
    permissions:
      mode: unrestricted
      rules: []
    agents:
      - name: permissions-editor
        blueprint: builder
        integration: copilot
        identity:
          display_name: Permissions Editor
          title: Fixture Agent
          emoji: P
        permissions:
          mode: restricted
          rules:
            - path: __RUNTIME__/workspaces/research
              tools: [read, search]
        runtime:
          timeout: 900
        default_memory:
          scope: agent
        routines:
          - id: research-digest
            prompt:
              scope: blueprint
              name: publish-draft
            enabled: false
            arguments: [--fixtures]
            schedule:
              every: "2h"
            memory:
              scope: routine
    workspaces: []