<section class="space-y-6">
  <div class="flex items-baseline justify-between gap-3">
    <h2 class="text-lg font-semibold text-gray-900 dark:text-gray-100">Execution Logs</h2>
    <p class="text-sm font-mono text-gray-500 dark:text-gray-400">{{ log_count }} file{{ '' if log_count == 1 else 's' }}</p>
  </div>

  {% if logs %}
  {% include "log_entries.html" %}
  {% else %}
  <div class="rounded-lg border border-gray-200 bg-white p-8 text-center text-gray-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400">No logs found.</div>
  {% endif %}
</section>
