{% extends "base.html" %}
{% set active = "logs" %}

{% block title %}Logs - {{ team_name }}{% endblock %}

{% block content %}
<div class="flex items-baseline justify-between mb-6">
  <h1 class="text-2xl font-bold text-gray-900">Execution Logs</h1>
</div>

{% if logs %}
{% include "log_entries.html" %}
{% endif %}

{% if not logs %}
<div class="bg-white rounded-lg border border-gray-200 p-8 text-center text-gray-500">No logs found.</div>
{% endif %}
{% endblock %}
